<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KinderHub — Нэвтрэх</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#fbf8f1; --ink:#173b31; --muted:#7b817c; --teal:#0d9488; --teal2:#14b8a6;
      --line:rgba(255,255,255,.7); --glass:rgba(255,255,255,.64);
      --shadow:0 24px 70px rgba(63,77,68,.14);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 10% 8%,rgba(196,239,224,.8),transparent 28%),
        radial-gradient(circle at 90% 12%,rgba(237,218,255,.75),transparent 28%),
        radial-gradient(circle at 84% 86%,rgba(255,226,196,.72),transparent 30%),
        var(--bg);
    }
    .card{
      width:min(100%,520px); background:var(--glass); backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px); border:1px solid var(--line);
      border-radius:30px; box-shadow:var(--shadow); padding:34px;
    }
    .brand{display:flex;align-items:center;gap:14px;margin-bottom:24px}
    .logo{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:26px;background:linear-gradient(145deg,var(--teal),#17766f);box-shadow:0 12px 30px rgba(13,148,136,.24)}
    h1{font-size:32px;line-height:1.1;margin:0;letter-spacing:-.035em}
    h2{font-size:22px;margin:4px 0 0;letter-spacing:-.02em}
    .sub{margin:7px 0 0;color:var(--muted);font-size:14px}
    .view{display:none}.view.active{display:block}
    label{display:block;font-size:13px;font-weight:800;margin:18px 0 8px}
    .field{position:relative}
    input{
      width:100%;padding:15px 48px 15px 15px;border-radius:16px;border:1px solid rgba(23,59,49,.12);
      background:rgba(255,255,255,.72);font-size:15px;outline:none;color:#1c2f29
    }
    input:focus{border-color:rgba(13,148,136,.5);box-shadow:0 0 0 4px rgba(13,148,136,.08)}
    .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;padding:8px;display:grid;place-items:center;color:#6b746e;line-height:0}
    .eye:hover{color:var(--teal)}
    button{font:inherit}
    .primary{
      width:100%;border:0;border-radius:16px;padding:15px 18px;margin-top:20px;color:white;font-weight:900;
      background:linear-gradient(135deg,var(--teal2),var(--teal));cursor:pointer;box-shadow:0 12px 28px rgba(13,148,136,.22)
    }
    .primary:disabled{opacity:.55;cursor:not-allowed}
    .link{border:0;background:transparent;color:var(--teal);font-weight:800;cursor:pointer;padding:0}
    .row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:16px;font-size:13px}
    .msg{margin-top:16px;padding:12px 14px;border-radius:14px;font-size:13px;display:none}
    .msg.show{display:block}
    .msg.ok{background:#eaf8f2;color:#17664f}
    .msg.err{background:#fff0ef;color:#a33a35}
    @media(max-width:560px){.card{padding:24px;border-radius:24px}h1{font-size:28px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="logo">K</div>
      <div>
        <h1>KinderHub</h1>
        <p class="sub" id="brandSub">Цэцэрлэгийн удирдлагын систем</p>
      </div>
    </div>

    <!-- НЭВТРЭХ -->
    <section id="loginView" class="view active">
      <h2>Нэвтрэх</h2>
      <p class="sub">И-мэйл, нууц үгээрээ нэвтэрнэ үү.</p>

      <label for="loginEmail">И-мэйл</label>
      <input id="loginEmail" type="email" autocomplete="email" placeholder="name@example.com">

      <label for="loginPassword">Нууц үг</label>
      <div class="field">
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Нууц үг">
        <button class="eye" data-target="loginPassword" aria-label="Нууц үг харах">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <button id="loginBtn" class="primary">Нэвтрэх</button>
      <div id="loginMsg" class="msg"></div>

      <div class="row">
        <button class="link" data-go="forgot">Нууц үгээ мартсан уу?</button>
        <button class="link" data-go="signup">Шинээр бүртгүүлэх</button>
      </div>
    </section>

    <!-- БҮРТГҮҮЛЭХ -->
    <section id="signupView" class="view">
      <h2>Бүртгүүлэх</h2>
      <p class="sub">Шинэ бүртгэл үүсгэнэ үү.</p>

      <label for="signupEmail">И-мэйл</label>
      <input id="signupEmail" type="email" autocomplete="email" placeholder="name@example.com">

      <label for="signupPassword">Нууц үг</label>
      <div class="field">
        <input id="signupPassword" type="password" autocomplete="new-password" placeholder="8-аас доошгүй тэмдэгт">
        <button class="eye" data-target="signupPassword" aria-label="Нууц үг харах">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <label for="signupConfirm">Нууц үг давтах</label>
      <div class="field">
        <input id="signupConfirm" type="password" autocomplete="new-password" placeholder="Нууц үгээ дахин оруулна уу">
        <button class="eye" data-target="signupConfirm" aria-label="Нууц үг харах">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <button id="signupBtn" class="primary">Бүртгүүлэх</button>
      <div id="signupMsg" class="msg"></div>

      <div class="row">
        <button class="link" data-go="login">Нэвтрэх рүү буцах</button>
      </div>
    </section>

    <!-- НУУЦ ҮГ МАРТСАН -->
    <section id="forgotView" class="view">
      <h2>Нууц үгээ мартсан уу?</h2>
      <p class="sub">Бүртгэлтэй и-мэйлээ оруулбал сэргээх холбоос илгээнэ.</p>

      <label for="forgotEmail">И-мэйл</label>
      <input id="forgotEmail" type="email" autocomplete="email" placeholder="name@example.com">

      <button id="sendBtn" class="primary">Сэргээх холбоос илгээх</button>
      <div id="forgotMsg" class="msg"></div>

      <div class="row">
        <button class="link" data-go="login">Нэвтрэх рүү буцах</button>
      </div>
    </section>

    <!-- ШИНЭ НУУЦ ҮГ (recovery холбоосоор орж ирнэ) -->
    <section id="resetView" class="view">
      <h2>Шинэ нууц үг тохируулах</h2>
      <p class="sub">Шинэ нууц үгээ оруулаад хадгална уу.</p>

      <label for="newPassword">Шинэ нууц үг</label>
      <div class="field">
        <input id="newPassword" type="password" autocomplete="new-password" placeholder="8-аас доошгүй тэмдэгт">
        <button class="eye" data-target="newPassword" aria-label="Нууц үг харах">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <label for="confirmPassword">Нууц үг давтах</label>
      <div class="field">
        <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Нууц үгээ дахин оруулна уу">
        <button class="eye" data-target="confirmPassword" aria-label="Нууц үг харах">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <button id="updateBtn" class="primary">Нууц үг шинэчлэх</button>
      <div id="resetMsg" class="msg"></div>

      <div class="row">
        <button class="link" data-go="login">Нэвтрэх рүү буцах</button>
      </div>
    </section>
  </main>

<script>
  // ====== ТОХИРГОО ======
  const SUPABASE_URL = 'https://oqggqtkgwrpkqdvjpikp.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9xZ2dxdGtnd3Jwa3FkdmpwaWtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MTI5MzQsImV4cCI6MjEwMjE4ODkzNH0.FshfvW-70tdHWseghshnSdrM_v1X8jbtYfm2VXKJpA8';
  // ⚠️ Нэвтэрсний дараа шилжих апп-ын хаяг (dashboard). Жишээ: '/dashboard.html', эсвэл өөр апп-ын бүтэн URL.
  const APP_URL = '/';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const views = {
    login:  document.getElementById('loginView'),
    signup: document.getElementById('signupView'),
    forgot: document.getElementById('forgotView'),
    reset:  document.getElementById('resetView'),
  };
  function show(name){
    Object.keys(views).forEach(k => views[k].classList.toggle('active', k === name));
  }
  function message(el, text, type){ el.textContent = text; el.className = 'msg show ' + type; }
  function clearMessage(el){ el.className = 'msg'; el.textContent = ''; }

  // Дэлгэц хооронд шилжих (data-go="...")
  document.querySelectorAll('[data-go]').forEach(btn=>{
    btn.onclick = () => show(btn.dataset.go);
  });

  // Eye icon — харах/нуух
  document.querySelectorAll('.eye').forEach(btn=>{
    btn.onclick = () => {
      const input = document.getElementById(btn.dataset.target);
      input.type = input.type === 'password' ? 'text' : 'password';
    };
  });

  // ---- НЭВТРЭХ ----
  document.getElementById('loginBtn').onclick = async () => {
    clearMessage(loginMsg);
    const email = document.getElementById('loginEmail').value.trim();
    const pass  = document.getElementById('loginPassword').value;
    if(!email || !pass) return message(loginMsg,'И-мэйл болон нууц үгээ оруулна уу.','err');

    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Нэвтэрч байна...';
    const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
    btn.disabled = false; btn.textContent = 'Нэвтрэх';

    if(error){
      let m = error.message;
      if(/invalid login credentials/i.test(m)) m = 'И-мэйл эсвэл нууц үг буруу байна.';
      else if(/email not confirmed/i.test(m)) m = 'И-мэйлээ баталгаажуулаагүй байна. И-мэйлээ шалгана уу.';
      return message(loginMsg, m, 'err');
    }
    message(loginMsg,'Амжилттай нэвтэрлээ. Шилжиж байна...','ok');
    setTimeout(() => { window.location.href = APP_URL; }, 700);
  };

  // ---- БҮРТГҮҮЛЭХ ----
  document.getElementById('signupBtn').onclick = async () => {
    clearMessage(signupMsg);
    const email = document.getElementById('signupEmail').value.trim();
    const p1 = document.getElementById('signupPassword').value;
    const p2 = document.getElementById('signupConfirm').value;
    if(!email)         return message(signupMsg,'И-мэйлээ оруулна уу.','err');
    if(p1.length < 8)  return message(signupMsg,'Нууц үг 8-аас доошгүй тэмдэгттэй байна.','err');
    if(p1 !== p2)      return message(signupMsg,'Хоёр нууц үг ижил биш байна.','err');

    const btn = document.getElementById('signupBtn');
    btn.disabled = true; btn.textContent = 'Бүртгэж байна...';
    const emailRedirectTo = window.location.origin + window.location.pathname;
    const { data, error } = await supabase.auth.signUp({ email, password: p1, options: { emailRedirectTo } });
    btn.disabled = false; btn.textContent = 'Бүртгүүлэх';

    if(error){
      let m = error.message;
      if(/already registered|already exists/i.test(m)) m = 'Энэ и-мэйл аль хэдийн бүртгэлтэй байна.';
      return message(signupMsg, m, 'err');
    }
    if(data.session){
      message(signupMsg,'Амжилттай бүртгэгдлээ. Шилжиж байна...','ok');
      setTimeout(() => { window.location.href = APP_URL; }, 700);
    } else {
      message(signupMsg,'Бүртгэл үүслээ. Баталгаажуулах холбоосыг и-мэйлээсээ нээнэ үү.','ok');
    }
  };

  // ---- СЭРГЭЭХ ХОЛБООС ИЛГЭЭХ ----
  document.getElementById('sendBtn').onclick = async () => {
    clearMessage(forgotMsg);
    const email = document.getElementById('forgotEmail').value.trim();
    if(!email) return message(forgotMsg,'И-мэйлээ оруулна уу.','err');

    const btn = document.getElementById('sendBtn');
    btn.disabled = true; btn.textContent = 'Илгээж байна...';
    const redirectTo = window.location.origin + window.location.pathname;
    const { error } = await supabase.auth.resetPasswordForEmail(email, { redirectTo });
    btn.disabled = false; btn.textContent = 'Сэргээх холбоос илгээх';

    if(error) return message(forgotMsg, error.message, 'err');
    message(forgotMsg,'Нууц үг сэргээх холбоос таны и-мэйл рүү илгээгдлээ.','ok');
  };

  // ---- НУУЦ ҮГ ШИНЭЧЛЭХ ----
  document.getElementById('updateBtn').onclick = async () => {
    clearMessage(resetMsg);
    const p1 = document.getElementById('newPassword').value;
    const p2 = document.getElementById('confirmPassword').value;
    if(p1.length < 8) return message(resetMsg,'Нууц үг 8-аас доошгүй тэмдэгттэй байна.','err');
    if(p1 !== p2)     return message(resetMsg,'Хоёр нууц үг ижил биш байна.','err');

    const btn = document.getElementById('updateBtn');
    btn.disabled = true; btn.textContent = 'Шинэчилж байна...';
    const { data:{ session } } = await supabase.auth.getSession();
    if(!session){
      btn.disabled = false; btn.textContent = 'Нууц үг шинэчлэх';
      return message(resetMsg,'Сэргээх холбоос хүчингүй эсвэл хугацаа дууссан байна.','err');
    }
    const { error } = await supabase.auth.updateUser({ password:p1 });
    btn.disabled = false; btn.textContent = 'Нууц үг шинэчлэх';
    if(error) return message(resetMsg, error.message, 'err');

    message(resetMsg,'Нууц үг амжилттай шинэчлэгдлээ. Нэвтрэх рүү шилжиж байна...','ok');
    setTimeout(() => show('login'), 1500);
  };

  // ---- Recovery холбоосыг барих (энэ хуудас руу буцаж ирнэ) ----
  (async () => {
    const url  = new URL(window.location.href);
    const hash = new URLSearchParams(url.hash.replace(/^#/, ''));
    const code = url.searchParams.get('code');
    const errDesc = url.searchParams.get('error_description') || hash.get('error_description');

    if(errDesc){ show('reset'); return message(resetMsg,'Сэргээх холбоос хүчингүй эсвэл хугацаа дууссан байна.','err'); }

    // Recovery холбоосны шинж (type=recovery) илэрвэл reset дэлгэц нээнэ
    const isRecovery = hash.get('type') === 'recovery' || url.searchParams.get('type') === 'recovery' || !!code;
    if(isRecovery){
      if(code){
        const { error } = await supabase.auth.exchangeCodeForSession(code);
        show('reset');
        if(error) message(resetMsg,'Сэргээх холбоос хүчингүй эсвэл хугацаа дууссан байна.','err');
      } else {
        show('reset');
      }
    }
  })();

  supabase.auth.onAuthStateChange((event) => {
    if(event === 'PASSWORD_RECOVERY') show('reset');
  });
</script>
</body>
</html>
